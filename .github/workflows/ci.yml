# Checks on every pull request and on pushes to main that touch the program,
# the Android app or the build scripts. Nothing is published here.
name: CI

on:
  pull_request:
    paths:
      - 'internal/**'
      - 'cmd/**'
      - 'assets/**'
      - 'windivert/**'
      - 'scripts/**'
      - 'go.mod'
      - 'go.sum'
      - 'android/**'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'internal/**'
      - 'cmd/**'
      - 'assets/**'
      - 'windivert/**'
      - 'scripts/**'
      - 'go.mod'
      - 'go.sum'
      - 'android/**'
      - '.github/workflows/**'

# Read-only token: these jobs do not write to the repository.
permissions:
  contents: read

# A new push to the same branch cancels the run that it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      # bash on every system (Git Bash on Windows), so a failing command fails the step
      - name: Vet
        shell: bash
        run: go vet ./...
      - name: Test
        shell: bash
        run: go test ./...

  cross-compile:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      # no cgo here: the cross compilers for these targets are not installed
      - name: Build all packages
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: go build ./...
